# GitHub Actions: runs the suite on Python 3.10 with the exact poetry.lock.

name: Tests

on:
    push:
        branches: [master, "feature/**"]
    pull_request:
        branches: [master]

permissions:
    contents: read

jobs:
    test:
        runs-on: ubuntu-latest
        # The full suite takes about 14 min locally; this stops a hung test early.
        timeout-minutes: 30
        steps:
            - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
              with:
                  persist-credentials: false
            - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
              with:
                  python-version: "3.10"
            # Poetry 1.8.3 generated poetry.lock, so a newer one could resolve it differently.
            - name: Install dependencies
              run: |
                  python -m pip install --upgrade pip
                  pip install "poetry==1.8.3"
                  poetry install --no-interaction
            # test_linters.py is skipped: black flags 5 files this branch does not touch.
            - name: Run tests
              run: poetry run pytest -q -p no:cacheprovider -o addopts="" --ignore=tests/test_linters.py --tb=short -rfE
